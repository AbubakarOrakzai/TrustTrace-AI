[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trusttrace-backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.8,<3",
    "PyYAML>=6,<7",
    "sqlglot>=26,<29",
    "cryptography>=43,<47",
    "httpx>=0.27,<1",
    "python-dotenv>=1,<2",
]

[tool.setuptools]
py-modules = [
    "evaluation_api",
    "main",
    "mock_tools",
    "scenarios",
    "runtime_config",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["audit*", "judge*", "models*", "policy*"]

[tool.setuptools.package-data]
policy = ["rules.yaml"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]
files = ["main.py", "audit", "models", "policy", "mock_tools.py", "scenarios.py"]
